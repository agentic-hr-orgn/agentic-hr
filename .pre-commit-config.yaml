# Pre-commit configuration for Agentic HR Core
# See https://pre-commit.com for more information

default_stages: [pre-commit]
fail_fast: false

repos:
  # 1. Secret Detection via Gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # 2. Python Linting & Formatting via Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 3. Code Formatting via Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: |
          (?x)^(
            \.next/.*|
            apps/api/\.venv/.*|
            pnpm-lock\.yaml|
            uv\.lock
          )$

  # 4. TypeScript / Next.js Linting via ESLint
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (Frontend Workspace)
        entry: pnpm --filter @agentic-hr/web lint
        language: system
        types: [file]
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false
